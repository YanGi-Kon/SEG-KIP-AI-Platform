name: Apply Acts layout fix

on:
  push:
    branches: [dev_ab]
    paths:
      - '.github/workflows/apply-acts-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_ab
          fetch-depth: 0

      - name: Keep completion donut compact on desktop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/modules/acts.html')
          text = path.read_text(encoding='utf-8')

          old = "@media(max-width:1200px){.analysis-fixed-head{grid-template-columns:1fr;max-height:none}.side-donut-box{width:auto}.kpi{grid-template-columns:repeat(2,1fr)}.analysis-desc{white-space:normal}}@media(max-width:900px){html,body{overflow:auto}.acts-shell{height:auto;min-height:100vh;overflow:visible;padding:12px}.acts-card{height:auto;min-height:calc(100vh - 24px);overflow:visible}.kpi,.fields,.line3{grid-template-columns:1fr}.tablewrap{max-height:60vh}.analysis-title-line h2{white-space:normal}}"
          new = "@media(max-width:1200px){.kpi{grid-template-columns:repeat(2,1fr)}.analysis-desc{white-space:normal}}@media(max-width:900px){html,body{overflow:auto}.acts-shell{height:auto;min-height:100vh;overflow:visible;padding:12px}.acts-card{height:auto;min-height:calc(100vh - 24px);overflow:visible}.analysis-fixed-head{grid-template-columns:1fr;max-height:none}.side-donut-box{width:auto}.kpi,.fields,.line3{grid-template-columns:1fr}.tablewrap{max-height:60vh}.analysis-title-line h2{white-space:normal}}"

          if old not in text:
              if new in text:
                  print('Acts layout fix already applied.')
                  raise SystemExit(0)
              raise SystemExit('Expected Acts responsive CSS block was not found; refusing unsafe edit.')

          if text.count(old) != 1:
              raise SystemExit('Expected exactly one Acts responsive CSS block.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify targeted change
        run: |
          node --check public/js/acts.js
          grep -F '@media(max-width:1200px){.kpi{grid-template-columns:repeat(2,1fr)}' public/modules/acts.html
          grep -F '@media(max-width:900px)' public/modules/acts.html

      - name: Commit layout fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/modules/acts.html
          git commit -m 'fix: keep Acts completion donut compact on desktop'
          git push origin HEAD:dev_ab
