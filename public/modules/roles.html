<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/i18n.js"></script>
<title>РОЛИ</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #061427; color: #eafcff; font-family: Arial, sans-serif; padding: 20px; }
  .table-container { background: rgba(0,0,0,0.35); border: 1px solid rgba(34,211,238,0.28); border-radius: 12px; padding: 20px; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(34,211,238,0.28); }
  th { color: #22d3ee; }
  button { border: 1px solid rgba(34,211,238,0.35); background: rgba(255,255,255,0.06); color: #eafcff; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.1); }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); place-items: center; }
  .modal.open { display: grid; }
  .modal-content { background: #061427; padding: 24px; border-radius: 12px; border: 1px solid #22d3ee; min-width: 400px; }
  .modal-content h3 { margin-top: 0; color: #22d3ee; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; color: #bdefff; }
  .form-group input[type="text"] { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid #22d3ee; color: white; border-radius: 4px; box-sizing: border-box; }
  .perms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .perm-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .error { color: #ff6b6b; margin-top: 10px; display: none; }
</style>
</head>
<body>

<h1>🔐 <span data-i18n="Управление ролями">Управление ролями</span></h1>
<button onclick="parent.postMessage({type:'SEG_CLOSE_MODULE'}, '*')"><span data-i18n="← Назад">← Назад</span></button>
<button onclick="openModal()" style="margin-left: 10px;"><span data-i18n="+ Создать роль">+ Создать роль</span></button>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th data-i18n="Название">Название</th>
        <th data-i18n="Дата создания">Дата создания</th>
        <th data-i18n="Действия">Действия</th>
      </tr>
    </thead>
    <tbody id="rolesTableBody">
      <tr><td colspan="3" data-i18n="Загрузка...">Загрузка...</td></tr>
    </tbody>
  </table>
</div>

<div class="modal" id="roleModal">
  <div class="modal-content">
    <h3 id="modalTitle" data-i18n="Создать роль">Создать роль</h3>
    <input type="hidden" id="roleId">
    
    <div class="form-group">
      <label data-i18n="Название роли">Название роли</label>
      <input type="text" id="roleName" placeholder="Например: Аудитор">
    </div>
    
    <div class="form-group">
      <label data-i18n="Права доступа">Права доступа</label>
      <label class="perm-item" style="color:#22d3ee; margin-bottom: 8px;"><input type="checkbox" id="permAll" value="*"> <span data-i18n="Полный доступ (Super Admin)">Полный доступ (Super Admin)</span></label>
      <div class="perms-grid" id="permsGrid">
        <!-- JS will populate checkboxes here -->
      </div>
    </div>
    
    <div class="error" id="modalError"></div>
    
    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
      <button onclick="closeModal()" data-i18n="Отмена">Отмена</button>
      <button onclick="saveRole()" style="background: rgba(34,211,238,0.2);" data-i18n="Сохранить">Сохранить</button>
    </div>
  </div>
</div>

<script>
const PERMISSIONS = [
  { val: 'users:manage', desc: 'Управление пользователями' },
  { val: 'roles:manage', desc: 'Управление ролями' },
  { val: 'workspace:read', desc: 'Просмотр рабочей области' },
  { val: 'workspace:update', desc: 'Редактирование рабочей области' },
  { val: 'workspace:archive', desc: 'Архивирование рабочей области' },
  { val: 'workspace:test', desc: 'Тестирование рабочей области' },
  { val: 'members:read', desc: 'Просмотр участников' },
  { val: 'members:create', desc: 'Добавление участников' },
  { val: 'members:update', desc: 'Редактирование участников' },
  { val: 'members:delete', desc: 'Удаление участников' },
  { val: 'signers:read', desc: 'Просмотр подписантов' },
  { val: 'signers:create', desc: 'Добавление подписантов' },
  { val: 'signers:update', desc: 'Редактирование подписантов' },
  { val: 'signers:delete', desc: 'Удаление подписантов' },
  { val: 'documents:read', desc: 'Просмотр документов' },
  { val: 'documents:create', desc: 'Создание документов' },
  { val: 'documents:send', desc: 'Отправка документов' },
  { val: 'documents:cancel', desc: 'Отмена документов' },
  { val: 'audit:read', desc: 'Просмотр аудита (журналов)' }
];

function getHeaders() {
  let token = '';
  try {
    token = sessionStorage.getItem('seg_kip_workspace_access_token');
    if (!token && parent && parent.sessionStorage) {
      token = parent.sessionStorage.getItem('seg_kip_workspace_access_token');
    }
  } catch (e) {}
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') };
}

async function loadRoles() {
  try {
    const res = await fetch('/api/roles', { headers: getHeaders() });
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    const tbody = document.getElementById('rolesTableBody');
    tbody.innerHTML = '';
    data.roles.forEach(role => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${role.name}</td>
        <td>${new Date(role.createdAt).toLocaleDateString()}</td>
        <td>
          <button onclick="editRole('${role.id}', '${role.name}', '${encodeURIComponent(JSON.stringify(role.permissions))}')" data-i18n="Изменить">Изменить</button>
          <button onclick="deleteRole('${role.id}')" style="color:#ff6b6b; border-color:#ff6b6b;" data-i18n="Удалить">Удалить</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    setTimeout(() => window.applyTranslations?.(), 0);
  } catch (err) {
    document.getElementById('rolesTableBody').innerHTML = '<tr><td colspan="3">Ошибка загрузки (нужны права)</td></tr>';
  }
}

function renderPerms() {
  const grid = document.getElementById('permsGrid');
  grid.innerHTML = PERMISSIONS.map(p => `
    <label class="perm-item" title="${p.val}">
      <input type="checkbox" name="permCb" value="${p.val}">
      <span data-i18n="${p.desc}">${p.desc}</span>
    </label>
  `).join('');
  setTimeout(() => window.applyTranslations?.(), 0);
}

function openModal() {
  document.getElementById('roleId').value = '';
  document.getElementById('roleName').value = '';
  document.getElementById('permAll').checked = false;
  document.querySelectorAll('input[name="permCb"]').forEach(cb => cb.checked = false);
  document.getElementById('modalTitle').setAttribute('data-i18n', 'Создать роль');
  document.getElementById('modalTitle').innerText = 'Создать роль';
  setTimeout(() => window.applyTranslations?.(), 0);
  document.getElementById('modalError').style.display = 'none';
  document.getElementById('roleModal').classList.add('open');
}

function closeModal() {
  document.getElementById('roleModal').classList.remove('open');
}

function editRole(id, name, permsStr) {
  openModal();
  document.getElementById('modalTitle').setAttribute('data-i18n', 'Редактировать роль');
  document.getElementById('modalTitle').innerText = 'Редактировать роль';
  setTimeout(() => window.applyTranslations?.(), 0);
  document.getElementById('roleId').value = id;
  document.getElementById('roleName').value = name;
  const perms = JSON.parse(decodeURIComponent(permsStr));
  if (perms.includes('*')) {
    document.getElementById('permAll').checked = true;
  }
  document.querySelectorAll('input[name="permCb"]').forEach(cb => {
    if (perms.includes(cb.value)) cb.checked = true;
  });
}

async function saveRole() {
  const id = document.getElementById('roleId').value;
  const name = document.getElementById('roleName').value;
  let permissions = [];
  if (document.getElementById('permAll').checked) {
    permissions = ['*'];
  } else {
    document.querySelectorAll('input[name="permCb"]:checked').forEach(cb => {
      permissions.push(cb.value);
    });
  }
  
  const url = id ? `/api/roles/${id}` : '/api/roles';
  const method = id ? 'PUT' : 'POST';
  
  try {
    const res = await fetch(url, {
      method,
      headers: getHeaders(),
      body: JSON.stringify({ name, permissions })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');
    closeModal();
    loadRoles();
  } catch (err) {
    const errDiv = document.getElementById('modalError');
    errDiv.innerText = err.message;
    errDiv.style.display = 'block';
  }
}

async function deleteRole(id) {
  if (!confirm('Удалить роль?')) return;
  try {
    const res = await fetch(`/api/roles/${id}`, { method: 'DELETE', headers: getHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');
    loadRoles();
  } catch (err) {
    alert(err.message);
  }
}

renderPerms();
loadRoles();
</script>
</body>
</html>
