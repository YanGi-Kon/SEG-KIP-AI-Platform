<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/i18n.js"></script>
<title>ПОЛЬЗОВАТЕЛИ</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { margin: 0; background: #061427; color: #eafcff; font-family: Arial, sans-serif; padding: 20px; }
  .table-container { background: rgba(0,0,0,0.35); border: 1px solid rgba(34,211,238,0.28); border-radius: 12px; padding: 20px; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(34,211,238,0.28); }
  th { color: #22d3ee; }
  button { border: 1px solid rgba(34,211,238,0.35); background: rgba(255,255,255,0.06); color: #eafcff; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.1); }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); place-items: center; }
  .modal.open { display: grid; }
  .modal-content { background: #061427; padding: 24px; border-radius: 12px; border: 1px solid #22d3ee; min-width: 400px; }
  .modal-content h3 { margin-top: 0; color: #22d3ee; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; color: #bdefff; }
  .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="password"], .form-group select { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid #22d3ee; color: white; border-radius: 4px; box-sizing: border-box; }
  .error { color: #ff6b6b; margin-top: 10px; display: none; }
  .badge { background: #22d3ee; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
</style>
</head>
<body>

<h1>👥 <span data-i18n="Управление пользователями">Управление пользователями</span></h1>
<button onclick="parent.postMessage({type:'SEG_CLOSE_MODULE'}, '*')"><span data-i18n="← Назад">← Назад</span></button>
<button onclick="openModal()" style="margin-left: 10px;"><span data-i18n="+ Добавить пользователя">+ Добавить пользователя</span></button>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th data-i18n="Имя">Имя</th>
        <th data-i18n="Email">Email</th>
        <th data-i18n="Роль">Роль</th>
        <th data-i18n="Статус">Статус</th>
        <th data-i18n="Действия">Действия</th>
      </tr>
    </thead>
    <tbody id="usersTableBody">
      <tr><td colspan="5" data-i18n="Загрузка...">Загрузка...</td></tr>
    </tbody>
  </table>
</div>

<div class="modal" id="userModal">
  <div class="modal-content">
    <h3 id="modalTitle" data-i18n="Добавить пользователя">Добавить пользователя</h3>
    <input type="hidden" id="userId">
    
    <div class="form-group">
      <label data-i18n="ФИО">ФИО</label>
      <input type="text" id="userFullName" placeholder="Иванов Иван">
    </div>
    
    <div class="form-group">
      <label data-i18n="Email">Email</label>
      <input type="email" id="userEmail" placeholder="ivan@example.com">
    </div>
    
    <div class="form-group">
      <label data-i18n="Системная Роль">Системная Роль</label>
      <select id="userRole">
        <option value="super_admin">Super Admin</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>

    <div class="form-group">
      <label data-i18n="Статус">Статус</label>
      <select id="userStatus">
        <option value="active" data-i18n="Активен">Активен</option>
        <option value="suspended" data-i18n="Заблокирован">Заблокирован</option>
      </select>
    </div>
    
    <div class="form-group">
      <label><span data-i18n="Пароль">Пароль</span> <span id="pwdHint" style="font-size:12px; color:#666;"></span></label>
      <input type="password" id="userPassword" placeholder="6+ символов" data-i18n-placeholder="6+ символов">
    </div>
    
    <div class="error" id="modalError"></div>
    
    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
      <button onclick="closeModal()" data-i18n="Отмена">Отмена</button>
      <button onclick="saveUser()" style="background: rgba(34,211,238,0.2);" data-i18n="Сохранить">Сохранить</button>
    </div>
  </div>
</div>

<script>


function getHeaders() {
  let token = '';
  try {
    token = sessionStorage.getItem('seg_kip_workspace_access_token');
    if (!token && parent && parent.sessionStorage) {
      token = parent.sessionStorage.getItem('seg_kip_workspace_access_token');
    }
  } catch (e) {}
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') };
}

function showModalError(message) {
  const errDiv = document.getElementById('modalError');
  errDiv.innerText = message;
  errDiv.style.display = 'block';
}

function hideModalError() {
  const errDiv = document.getElementById('modalError');
  errDiv.innerText = '';
  errDiv.style.display = 'none';
}

function formatNonJsonResponse(text) {
  const compact = String(text || '').replace(/\s+/g, ' ').trim();
  if (!compact) return 'Server returned non-JSON response';
  if (compact.startsWith('<!DOCTYPE') || compact.startsWith('<html')) {
    return 'Server returned non-JSON response';
  }
  return compact.slice(0, 240);
}

async function readApiPayload(res) {
  const contentType = String(res.headers.get('content-type') || '').toLowerCase();
  if (contentType.includes('application/json')) {
    return { isJson: true, data: await res.json() };
  }
  return { isJson: false, data: await res.text() };
}

function validatePasswordClient(password) {
  const value = String(password || '');
  if (value.length < 6 || value.length > 200) {
    return 'Пароль должен содержать 6-200 символов';
  }
  return '';
}

async function loadData() {
  try {


    const res = await fetch('/api/users', { headers: getHeaders() });
    const payload = await readApiPayload(res);
    if (!res.ok) {
      throw new Error(payload.isJson ? (payload.data.error || 'Failed to load users') : formatNonJsonResponse(payload.data));
    }
    if (!payload.isJson) {
      throw new Error('Server returned non-JSON response');
    }

    const data = payload.data;
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '';
    data.users.forEach(user => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${user.fullName}</td>
        <td>${user.email}</td>
        <td><span class="badge">${user.platformRole}</span></td>
        <td>${user.status === 'active' ? '<span data-i18n="Активен">Активен</span>' : '<span style="color:#ff6b6b" data-i18n="Заблокирован">Заблокирован</span>'}</td>
        <td>
          <button onclick="editUser('${user.id}', '${encodeURIComponent(user.fullName)}', '${user.platformRole}', '${user.status}')" data-i18n="Редактировать">Редактировать</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    setTimeout(() => window.applyTranslations?.(), 0);
  } catch (err) {
    document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5">Ошибка загрузки (нужны права)</td></tr>';
  }
}

function openModal() {
  document.getElementById('userId').value = '';
  document.getElementById('userFullName').value = '';
  document.getElementById('userEmail').value = '';
  document.getElementById('userEmail').disabled = false;
  document.getElementById('userPassword').value = '';
  document.getElementById('userStatus').value = 'active';
  document.getElementById('userRole').value = 'user';
  document.getElementById('modalTitle').setAttribute('data-i18n', 'Добавить пользователя');
  document.getElementById('modalTitle').innerText = 'Добавить пользователя';
  setTimeout(() => window.applyTranslations?.(), 0);
  document.getElementById('pwdHint').innerText = '(6+ символов)';
  document.getElementById('pwdHint').setAttribute('data-i18n', '(6+ символов)');
  hideModalError();
  document.getElementById('userModal').classList.add('open');
}

function closeModal() {
  document.getElementById('userModal').classList.remove('open');
}

function editUser(id, fullNameEnc, roleId, status) {
  openModal();
  document.getElementById('modalTitle').setAttribute('data-i18n', 'Редактировать пользователя');
  document.getElementById('modalTitle').innerText = 'Редактировать пользователя';
  setTimeout(() => window.applyTranslations?.(), 0);
  document.getElementById('userId').value = id;
  document.getElementById('userFullName').value = decodeURIComponent(fullNameEnc);
  document.getElementById('userEmail').value = 'Скрыто (нельзя изменить)';
  document.getElementById('userEmail').disabled = true;
  document.getElementById('userRole').value = roleId;
  document.getElementById('userStatus').value = status;
  document.getElementById('pwdHint').innerText = '(оставьте пустым, чтобы не менять; если меняете: 6+ символов)';
  document.getElementById('pwdHint').setAttribute('data-i18n', '(оставьте пустым, чтобы не менять; если меняете: 6+ символов)');
}

async function saveUser() {
  const id = document.getElementById('userId').value;
  const fullName = document.getElementById('userFullName').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  const platformRole = document.getElementById('userRole').value.trim();
  const status = document.getElementById('userStatus').value;
  const password = document.getElementById('userPassword').value;

  hideModalError();

  if (!fullName) {
    showModalError('ФИО обязательно');
    return;
  }

  if (!platformRole) {
    showModalError('Системная роль обязательна');
    return;
  }

  if (!id && !email) {
    showModalError('Email обязателен для нового пользователя');
    return;
  }

  if (!id && !password) {
    showModalError('Пароль обязателен для нового пользователя');
    return;
  }

  if (password) {
    const passwordError = validatePasswordClient(password);
    if (passwordError) {
      showModalError(passwordError);
      return;
    }
  }

  const url = id ? `/api/users/${id}` : '/api/users';
  const method = id ? 'PUT' : 'POST';

  const body = { fullName, platformRole, status };
  if (!id) body.email = email;
  if (password) body.password = password;

  try {
    const res = await fetch(url, {
      method,
      headers: getHeaders(),
      body: JSON.stringify(body)
    });

    const payload = await readApiPayload(res);
    if (!payload.isJson) {
      throw new Error(formatNonJsonResponse(payload.data));
    }

    const data = payload.data;
    if (!res.ok) {
      throw new Error(data.error || data.message || 'Ошибка');
    }

    closeModal();
    loadData();
  } catch (err) {
    showModalError(err.message || 'Ошибка');
  }
}

loadData();
</script>
</body>
</html>
