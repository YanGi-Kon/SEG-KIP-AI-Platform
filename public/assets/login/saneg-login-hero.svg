<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="52%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#075985" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031525"/>
      <stop offset="58%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061427"/>
      <stop offset="0.5" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#22d3ee" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <pattern id="lights" width="30" height="34" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="4" height="9" rx="1" fill="#22d3ee" opacity="0.55"/>
      <rect x="12" y="7" width="4" height="5" rx="1" fill="#34d399" opacity="0.45"/>
      <rect x="21" y="3" width="4" height="12" rx="1" fill="#38bdf8" opacity="0.35"/>
      <rect x="6" y="23" width="5" height="4" rx="1" fill="#34d399" opacity="0.4"/>
      <rect x="17" y="24" width="4" height="6" rx="1" fill="#22d3ee" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#020817"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>

  <!-- server-room depth -->
  <g opacity="0.9">
    <path d="M0 0h380v760H0z" fill="url(#rack)" opacity="0.72"/>
    <path d="M1220 0h380v760h-380z" fill="url(#rack)" opacity="0.72"/>
    <path d="M382 0h90v740h-90z" fill="#031525" opacity="0.62"/>
    <path d="M1128 0h90v740h-90z" fill="#031525" opacity="0.62"/>
    <g opacity="0.8">
      <rect x="38" y="52" width="270" height="740" rx="20" fill="#041326" stroke="#155e75" stroke-opacity="0.35"/>
      <rect x="82" y="82" width="190" height="675" fill="url(#lights)" opacity="0.82"/>
      <rect x="1292" y="52" width="270" height="740" rx="20" fill="#041326" stroke="#155e75" stroke-opacity="0.35"/>
      <rect x="1336" y="82" width="190" height="675" fill="url(#lights)" opacity="0.82"/>
      <rect x="420" y="85" width="95" height="610" rx="16" fill="#041326" stroke="#0ea5e9" stroke-opacity="0.18"/>
      <rect x="1085" y="85" width="95" height="610" rx="16" fill="#041326" stroke="#0ea5e9" stroke-opacity="0.18"/>
    </g>
  </g>

  <!-- lights -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="180" y="0" width="90" height="16" rx="7" fill="#38bdf8" opacity="0.65"/>
    <rect x="1308" y="0" width="90" height="16" rx="7" fill="#38bdf8" opacity="0.65"/>
    <ellipse cx="800" cy="450" rx="350" ry="92" fill="#22d3ee" opacity="0.05"/>
  </g>

  <!-- floor -->
  <path d="M0 650h1600v350H0z" fill="url(#floor)" opacity="0.82"/>
  <path d="M380 650h840l380 350H0z" fill="url(#grid)" opacity="0.58"/>
  <g stroke="#22d3ee" stroke-opacity="0.22" fill="none">
    <path d="M420 650 120 1000"/>
    <path d="M565 650 410 1000"/>
    <path d="M800 650 800 1000"/>
    <path d="M1035 650 1190 1000"/>
    <path d="M1180 650 1480 1000"/>
    <path d="M0 760h1600"/>
    <path d="M0 875h1600"/>
  </g>

  <!-- holographic industrial twin -->
  <g transform="translate(800 635)" filter="url(#glow)">
    <ellipse rx="330" ry="78" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.75"/>
    <ellipse rx="250" ry="56" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.52"/>
    <ellipse rx="155" ry="34" fill="none" stroke="#34d399" stroke-width="2" opacity="0.48"/>
    <g stroke="#67e8f9" fill="none" stroke-width="3" opacity="0.92">
      <path d="M-210 0v-72h30v72M-165 0v-108h42v108M-105 0v-148h56v148M-35 0v-92h40v92M35 0v-205h66v205M120 0v-118h45v118M190 0v-78h30v78"/>
      <path d="M-230-34h480M-210-72h80M-110-148h100M35-205h66M120-118h80" opacity="0.65"/>
      <path d="M-250 0h520" opacity="0.8"/>
    </g>
    <g fill="#22d3ee" opacity="0.75">
      <circle cx="-165" cy="-108" r="5"/><circle cx="-77" cy="-148" r="5"/><circle cx="68" cy="-205" r="5"/><circle cx="142" cy="-118" r="5"/><circle cx="205" cy="-78" r="5"/>
    </g>
  </g>

  <!-- floating abstract nodes, no text -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.7" filter="url(#glow)">
    <path d="M250 245c120-95 235 40 345-25 82-48 120-120 210-38 92 84 210-28 320 48 95 65 130 12 220 38"/>
    <circle cx="292" cy="225" r="8" fill="#020817"/><circle cx="292" cy="225" r="8"/>
    <circle cx="595" cy="220" r="8" fill="#020817"/><circle cx="595" cy="220" r="8"/>
    <circle cx="805" cy="178" r="10" fill="#020817"/><circle cx="805" cy="178" r="10"/>
    <circle cx="1125" cy="230" r="8" fill="#020817"/><circle cx="1125" cy="230" r="8"/>
    <circle cx="1345" cy="268" r="8" fill="#020817"/><circle cx="1345" cy="268" r="8"/>
  </g>

  <rect width="1600" height="1000" fill="#020817" opacity="0.14"/>
  <ellipse cx="800" cy="570" rx="560" ry="230" fill="#22d3ee" opacity="0.08" filter="url(#soft)"/>
</svg>
